# Everything a change has to pass: formatting, lints, all tests.
# The same as ./scripts/check.sh on a developer's machine.
name: check

on:
  push:
    branches: [main, page-surface]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Without what a debugger needs, and without what makes the next build
# of the same tree faster: with them a build of Typst and of the tests
# fills the runner's disk (the first run ended in "No space left on
# device").
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The toolchain the lints are kept clean with: a newer one may
      # bring lints of its own.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # No window is opened and no system library is needed: the tests
      # drive the viewer without one, with the fonts Typst ships. The
      # comparisons with Neovim are skipped where it is not installed.
      - run: ./scripts/check.sh
